name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Go backend: build, vet, and unit tests ---
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate templ
        run: templ generate

      - name: Build
        run: go build ./cmd/arabica

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  # --- Integration tests (real Go server + test PDS) ---
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@latest

      - name: Generate templ
        run: templ generate

      - name: Integration tests
        run: cd tests/integration && go test -tags=integration -count=1 ./...

  # --- TypeScript type generation drift check ---
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install tygo
        run: go install github.com/gzuidhof/tygo/cmd/tygo@latest

      - name: Check generated types are up to date
        run: |
          tygo generate --config tygo.yml
          git diff --exit-code web/src/lib/types/generated/ || \
            (echo "::error::Generated types are out of date. Run 'just types-generate' and commit." && exit 1)

  # --- SvelteKit frontend: type-check + unit tests ---
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm run check:svelte

      - name: SvelteKit unit tests
        run: cd web && pnpm run test

      - name: Legacy island unit tests
        run: pnpm run test:svelte
