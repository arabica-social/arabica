<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Arabica · AI entry prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  .entry-row{position:relative;display:block!important}
  .entry-input{display:block;width:100%;min-height:48px!important;padding:13px 58px 13px 14px!important;background:var(--surface)!important}
  .entry-row>.send{position:absolute;right:6px;bottom:6px;width:36px;height:36px;border-radius:8px}

  /* Compact entry: one input row, at most one unboxed suggestion row. */
  .entry-card{padding:0!important;background:none!important;border:0!important;box-shadow:none!important}
  .entry-card::before{display:none!important}
  .entry{margin:20px 0 24px!important}
  .examples{flex-wrap:nowrap!important;overflow:hidden;gap:6px!important;margin-top:6px!important;max-height:30px}
  .chip{padding:3px 9px!important;border:1px solid var(--border-strong)!important;border-radius:999px!important;background:var(--surface)!important;white-space:nowrap;font-size:12px!important}
  .chip:hover{border-color:var(--accent)!important;background:var(--accent-tint)!important;color:var(--ink)}
  .combo{min-height:40px}
  .picked{background:var(--bg)!important;border-color:var(--border)!important}
  .card{border-radius:10px!important;box-shadow:none!important}

  :root{
    --bg:#f4ede2; --surface:#fbf7f1; --surface-2:#f0e7da;
    --ink:#2a201b; --muted:#7a6a5d; --faint:#a4948a;
    --border:#e4d8c8; --border-strong:#d3c4b1;
    --accent:#6b3f2e; --accent-tint:#efe1d6; --accent-ink:#fff;
    --added:#4f7a54; --warn:#9a6b2f; --danger:#a34a3c;
    --bean:#7a4b2a; --brewer:#5f6f3a; --grinder:#6a4a6b; --recipe:#8a5a2b;
    --sans:'Inter',system-ui,sans-serif; --serif:'Fraunces',Georgia,serif;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16100d; --surface:#201814; --surface-2:#281f19;
      --ink:#efe6db; --muted:#b3a294; --faint:#8a7a6d;
      --border:#33271f; --border-strong:#44342a;
      --accent:#c08a68; --accent-tint:#2c211a; --accent-ink:#1a120e;
      --added:#8fbb8f; --warn:#d3a566; --danger:#dd8072;
      --bean:#c58a5c; --brewer:#a3b06a; --grinder:#b98cb9; --recipe:#c99b5e;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;color:inherit}
  .wrap{max-width:1040px;margin:0 auto;padding:0 20px}
  a{color:inherit}

  /* ---------- top bar ---------- */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .topbar .wrap{display:flex;align-items:center;gap:14px;height:56px}
  .brand{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em}
  .brand .dot{color:var(--accent)}
  .nav{display:flex;gap:18px;margin-left:auto;font-size:13.5px;color:var(--muted)}
  .nav a{text-decoration:none}
  .nav a:hover{color:var(--ink)}
  @media(max-width:640px){.nav{display:none}}

  /* ---------- home ---------- */
  .body{padding:0 0 90px}
  .masthead{padding:44px 0 8px}
  .masthead-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  h1{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1.05;margin:0;letter-spacing:-.01em}
  .btn{border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
  .btn-ghost{background:transparent}

  /* ---------- AI entry bar ---------- */
  .entry{margin:26px 0 30px}
  .entry-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;box-shadow:0 1px 0 rgba(0,0,0,.02),0 12px 30px -22px rgba(60,35,20,.35)}
  .entry-card::before{content:"";position:absolute;inset:0;border-radius:18px;background:var(--accent-tint);opacity:.28;z-index:-1;filter:blur(1px)}
  .entry-label{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .entry-label .spark{color:var(--accent)}
  .entry-row{display:flex;gap:10px;align-items:flex-end}
  .entry-input{flex:1;min-height:46px;max-height:160px;resize:none;border:1px solid var(--border);background:var(--bg);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.4;outline:none}
  .entry-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
  .send{flex:0 0 auto;width:46px;height:46px;border-radius:12px;border:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .send:hover{filter:brightness(1.07)}
  .send svg{width:20px;height:20px}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{border:1px dashed var(--border-strong);background:transparent;border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted)}
  .chip:hover{border-style:solid;color:var(--ink);border-color:var(--accent)}

  /* ---------- faint feed skeleton ---------- */
  .feed-note{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;margin:34px 0 14px}
  .feed-note:before{content:"";height:1px;flex:1;background:var(--border)}
  .feed-note:after{content:"";height:1px;flex:1;background:var(--border)}
  .feed{display:grid;grid-template-columns:1fr 1fr;gap:16px;opacity:.55}
  @media(max-width:720px){.feed{grid-template-columns:1fr}}
  .feed-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;min-height:120px}
  .sk{background:var(--surface-2);border-radius:6px;height:10px}
  .sk.lg{height:14px}

  /* ---------- chat view ---------- */
  .chat{display:none;min-height:100vh;flex-direction:column}
  .chat.open{display:flex}
  .home.hidden{display:none}
  .chatbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .chatbar .wrap{display:flex;align-items:center;gap:12px;height:56px}
  .chatbar .title{font-weight:600;font-size:14px}
  .chatbar .sub{color:var(--faint);font-size:12.5px}
  .iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
  .iconbtn:hover{color:var(--ink);border-color:var(--border-strong)}
  .chat-scroll{flex:1;overflow:auto;padding:22px 0 130px}
  .thread{max-width:760px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:20px}
  .msg{display:flex;gap:12px}
  .msg .who{flex:0 0 30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:11px;font-weight:600}
  .msg.user .who{background:var(--accent);color:var(--accent-ink)}
  .msg.ai .who{background:var(--surface-2);color:var(--accent);border:1px solid var(--border)}
  .msg .content{flex:1;min-width:0}
  .msg p{margin:0 0 6px}
  .msg .bubble{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 14px;display:inline-block;max-width:100%}
  .msg.user .bubble{background:var(--surface-2)}
  .msg .hint{color:var(--muted);font-size:13px;margin-top:2px}

  /* form card */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-top:4px;box-shadow:0 18px 40px -34px rgba(60,35,20,.5)}
  .card-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);background:linear-gradient(var(--surface),var(--surface))padding-box,var(--accent-tint)}
  .tag{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-tint);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  .card-head .grow{flex:1}
  .card-head .meta{font-size:12px;color:var(--muted)}
  .card-body{padding:16px}
  .group{margin-bottom:18px}
  .group:last-child{margin-bottom:0}
  .glabel{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .glabel:after{content:"";height:1px;flex:1;background:var(--border)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:12.5px;color:var(--muted);font-weight:500}
  .ctl{border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:9px 11px;font-size:14px;width:100%}
  .ctl:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
  .ctl.picked{background:color-mix(in srgb,var(--accent-tint) 60%,var(--bg));border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
  .flagged .ctl{border-style:dashed;border-color:var(--warn)}
  .flag{font-size:11px;color:var(--warn);display:flex;align-items:center;gap:5px}
  textarea.ctl{min-height:62px;resize:vertical}
  .combo{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--bg);border-radius:9px;padding:8px 10px}
  .combo .pill{display:inline-flex;align-items:center;gap:6px;background:var(--accent-tint);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);border-radius:999px;padding:3px 9px;font-size:13px;font-weight:500}
  .combo .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .combo input{border:none;background:transparent;outline:none;flex:1;font-size:14px;min-width:0}
  .card-foot{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--border);background:var(--surface-2)}
  .card-foot .grow{flex:1}
  .card-foot .note{font-size:12px;color:var(--muted)}

  /* composer */
  .composer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:linear-gradient(transparent,var(--bg) 34%);padding:20px 20px 18px}
  .composer-inner{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 10px 10px 14px;box-shadow:0 20px 40px -30px rgba(60,35,20,.5)}
  .composer textarea{flex:1;border:none;background:transparent;outline:none;resize:none;font-size:15px;line-height:1.4;max-height:120px;min-height:24px;padding:6px 0}
  .composer .send{width:40px;height:40px;border-radius:11px}

  .toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:40}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .typing{display:inline-flex;gap:4px;padding:12px 14px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:b 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div class="home" id="home">
  <div class="topbar"><div class="wrap">
    <span class="brand">arabica<span class="dot">.</span></span>
    <nav class="nav">
      <a href="#">My Coffee</a><a href="#">Explore</a><a href="#">Recipes</a><a href="#">Profile</a>
    </nav>
  </div></div>

  <div class="wrap body">
    <header class="masthead">
      <div class="masthead-row">
        <h1>Community</h1>
        <button class="btn btn-primary" onclick="openChat('')">Log Brew</button>
      </div>

      <div class="entry">
        <div class="entry-card">
          <div class="entry-row">
            <textarea id="entryInput" class="entry-input" rows="1" placeholder="Describe a brew or bean"></textarea>
            <button class="send" title="Send" onclick="openChat(document.getElementById('entryInput').value)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="feed-note">Community activity</div>
      <div class="feed">
        <div class="feed-card"><div class="sk" style="width:36%;margin-bottom:12px"></div><div class="sk lg" style="width:80%;margin-bottom:8px"></div><div class="sk" style="width:55%"></div></div>
        <div class="feed-card"><div class="sk" style="width:30%;margin-bottom:12px"></div><div class="sk lg" style="width:70%;margin-bottom:8px"></div><div class="sk" style="width:60%"></div></div>
      </div>
    </header>
  </div>
</div>

<!-- ============ CHAT ============ -->
<div class="chat" id="chat">
  <div class="chatbar"><div class="wrap">
    <button class="iconbtn" title="Back" onclick="closeChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div>
      <div class="title">New brew</div>
      <div class="sub" id="chatSub">Draft · not saved</div>
    </div>
    <div style="flex:1"></div>
    <button class="btn btn-ghost" onclick="closeChat()">Close</button>
  </div></div>

  <div class="chat-scroll" id="chatScroll">
    <div class="thread" id="thread">
      <!-- user -->
      <div class="msg user">
        <div class="who">You</div>
        <div class="content"><div class="bubble" id="userMsg">V60 with Ethiopia Gedeb this morning, 15g to 250g, 3 pours, 2:45 total, 92°C. Tasted like jasmine and bergamot, 8/10.</div></div>
      </div>
      <!-- ai -->
      <div class="msg ai">
        <div class="who">✦</div>
        <div class="content">
          <p class="hint">Matched Ethiopia Gedeb and Hario V60 02.</p>

          <div class="card">
            <div class="card-body">
              <div class="group">
                <div class="glabel">What</div>
                <div class="grid">
                  <div class="field"><label>Bean</label><div class="combo picked"><input aria-label="Bean" value="Ethiopia Gedeb" readonly></div></div>
                  <div class="field"><label>Brewer</label><div class="combo picked"><input aria-label="Brewer" value="Hario V60 02" readonly></div></div>
                </div>
              </div>
              <div class="group">
                <div class="glabel">Method</div>
                <div class="grid">
                  <div class="field"><label>Coffee (g)</label><input class="ctl picked" value="15"></div>
                  <div class="field"><label>Water (g)</label><input class="ctl picked" value="250"></div>
                  <div class="field"><label>Temperature (°C)</label><input class="ctl picked" value="92"></div>
                  <div class="field"><label>Total time</label><input class="ctl picked" value="2:45"></div>
                  <div class="field"><label>Grind setting</label><input class="ctl" placeholder="Not specified"></div>
                  <div class="field"><label>Pours</label><input class="ctl picked" value="3"></div>
                </div>
              </div>
              <div class="group">
                <div class="glabel">Observations</div>
                <div class="grid">
                  <div class="field" style="grid-column:1/-1"><label>Tasting notes</label><textarea class="ctl picked">Jasmine and bergamot.</textarea></div>
                  <div class="field"><label>Rating</label><input class="ctl picked" value="8 / 10"></div>
                  <div class="field"><label>Recipe</label><div class="combo"><input placeholder="None selected" readonly></div></div>
                </div>
              </div>
            </div>
            <div class="card-foot">
              
              <span class="grow"></span>
              <button class="btn btn-ghost" onclick="toast('Opened the full brew form')">Open full form</button>
              <button class="btn btn-primary" onclick="saveBrew()">Save brew</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="composer">
    <div class="composer-inner">
      <textarea id="composerInput" rows="1" placeholder="Add a detail, or describe another brew…"></textarea>
      <button class="send" title="Send" onclick="sendComposer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="sr" aria-live="polite" id="live"></div>

<script>
  const home=document.getElementById('home'),chat=document.getElementById('chat');
  const thread=document.getElementById('thread'),scroll=document.getElementById('chatScroll');
  const userMsg=document.getElementById('userMsg'),entryInput=document.getElementById('entryInput');
  const composer=document.getElementById('composerInput');
  let saved=false;

  function grow(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px'}
  entryInput.addEventListener('input',()=>grow(entryInput));
  composer.addEventListener('input',()=>grow(composer));

  function openChat(text){
    const t=(text||'').trim();
    // Start from the canonical example so the form stays coherent.
    if(t) userMsg.textContent=t;
    home.classList.add('hidden');chat.classList.add('open');
    document.getElementById('chatSub').textContent='Draft · not saved';
    window.scrollTo(0,0);document.body.style.overflow='hidden';scroll.scrollTop=scroll.scrollHeight;
    document.getElementById('live').textContent='Chat opened with a filled brew form.';
  }
  function closeChat(){
    chat.classList.remove('open');home.classList.remove('hidden');document.body.style.overflow='';
    entryInput.value='';grow(entryInput);saved=false;
    document.getElementById('chatSub').textContent='Draft · not saved';
  }
  function saveBrew(){
    if(saved){toast('Already saved');return}
    saved=true;
    document.getElementById('chatSub').textContent='Saved to your journal';
    toast('Brew saved to your PDS');
  }
  function sendComposer(){
    const t=composer.value.trim(); if(!t) return;
    const m=document.createElement('div'); m.className='msg user';
    m.innerHTML='<div class="who">You</div><div class="content"><div class="bubble"></div></div>';
    m.querySelector('.bubble').textContent=t;
    thread.appendChild(m);
    composer.value='';grow(composer);
    const a=document.createElement('div'); a.className='msg ai';
    a.innerHTML='<div class="who">✦</div><div class="content"><div class="typing"><i></i><i></i><i></i></div></div>';
    thread.appendChild(a); scroll.scrollTop=scroll.scrollHeight;
    // prototype-only canned reply
    setTimeout(()=>{
      a.querySelector('.content').innerHTML='<p class="hint">Updated the draft. Say “save” or use the button when it looks right.</p>';
      scroll.scrollTop=scroll.scrollHeight;
    },900);
  }
  let tt;
  function toast(msg){
    const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
    clearTimeout(tt);tt=setTimeout(()=>el.classList.remove('show'),1800);
    document.getElementById('live').textContent=msg;
  }
</script>
</body>
</html>
